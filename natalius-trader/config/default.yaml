# Natalius Trader Configuration

# Trading Engine Settings
engine:
  name: "Natalius Trader"
  version: "1.0.0"
  mode: "backtest"  # backtest | paper | live
  base_currency: "USDT"
  
# Risk Management
risk:
  max_position_size: 10000  # in base currency
  max_drawdown: 0.05  # 5%
  max_daily_loss: 0.02  # 2%
  position_sizing: "fixed"  # fixed | percent | kelly
  stop_loss_required: true
  take_profit_required: false
  
# Backtest Settings
backtest:
  start_date: "2024-01-01"
  end_date: "2024-12-01"
  initial_capital: 10000
  commission_rate: 0.001  # 0.1%
  slippage_model: "fixed"  # fixed | random | volume_based
  slippage_rate: 0.0005  # 0.05%
  
# Exchange Connections
exchanges:
  binance:
    enabled: true
    api_key: "${BINANCE_API_KEY}"
    api_secret: "${BINANCE_API_SECRET}"
    testnet: true
    rate_limit: 1200  # requests per minute
    
  bybit:
    enabled: false
    api_key: "${BYBIT_API_KEY}"
    api_secret: "${BYBIT_API_SECRET}"
    testnet: true
    
  okx:
    enabled: false
    api_key: "${OKX_API_KEY}"
    api_secret: "${OKX_API_SECRET}"
    passphrase: "${OKX_PASSPHRASE}"
    
# Database Configuration
database:
  type: "postgresql"  # postgresql | sqlite
  host: "localhost"
  port: 5432
  name: "natalius_trader"
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  
# Redis Cache
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: "${REDIS_PASSWORD}"
  
# Logging
logging:
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"
  rotation: "1 day"
  retention: "30 days"
  file: "logs/natalius.log"
  
# Notifications
notifications:
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    username: "${EMAIL_USERNAME}"
    password: "${EMAIL_PASSWORD}"
    
# Websocket Settings
websocket:
  reconnect_attempts: 5
  reconnect_delay: 10  # seconds
  ping_interval: 30  # seconds
  timeout: 60  # seconds
  
# Data Settings
data:
  provider: "tardis"  # tardis | exchange | local
  cache_dir: "data/historical_prices"
  timeframe: "1m"  # 1m | 5m | 15m | 1h | 1d
  
# Performance Monitoring
monitoring:
  prometheus:
    enabled: true
    port: 9090
    
  metrics:
    - "trades_total"
    - "pnl_total"
    - "sharpe_ratio"
    - "max_drawdown"
    - "win_rate"
