global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Bot V3 Control Plane
  - job_name: 'bot-v3'
    static_configs:
      - targets: ['bot-v3:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Market Workers
  - job_name: 'market-workers'
    static_configs:
      - targets: ['market-worker:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Alerting rules
rule_files:
  - /etc/prometheus/alerts.yml

# Alertmanager (optional)
# alerting:
