version: '3.8'

services:
  # ============================================================================
  # Bot V3 — FastAPI Control Plane + Worker
  # ============================================================================
  bot-v3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot-v3-control-plane
    restart: unless-stopped
    ports:
      - "8000:8000"  # FastAPI
      - "9090:9090"  # Prometheus metrics
    environment:
      - ENV=production
      - GUARDRAIL_MODE=risk_free_only
      - LOG_LEVEL=INFO
      - POLYMARKET_API_KEY=${POLYMARKET_API_KEY}
      - POLYMARKET_API_SECRET=${POLYMARKET_API_SECRET}
      - POLYMARKET_API_PASSPHRASE=${POLYMARKET_API_PASSPHRASE}
      - POLYMARKET_PRIVATE_KEY=${POLYMARKET_PRIVATE_KEY}
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # Market Worker — Event-Driven (per market or pool)
  # ============================================================================
  market-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: bot-v3-market-worker
    restart: unless-stopped
    depends_on:
      - bot-v3
    environment:
      - ENV=production
      - WORKER_ID=worker-1
      - MARKETS=BTC-DEC31,ETH-DEC31
      - WS_URL=ws://bot-v3-control-plane:8000/v1/ws/market-stream
      - POLYMARKET_API_KEY=${POLYMARKET_API_KEY}
      - POLYMARKET_API_SECRET=${POLYMARKET_API_SECRET}
      - POLYMARKET_API_PASSPHRASE=${POLYMARKET_API_PASSPHRASE}
      - POLYMARKET_PRIVATE_KEY=${POLYMARKET_PRIVATE_KEY}
    volumes:
      - ./logs:/app/logs
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "python", "-c", "print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2  # Scale based on number of markets
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # Prometheus — Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: bot-v3-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - bot-network
    depends_on:
      - bot-v3

  # ============================================================================
  # Grafana — Visualization Dashboard
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: bot-v3-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - bot-network
    depends_on:
      - prometheus

  # ============================================================================
  # Redis — Caching & Pub/Sub (optional for worker coordination)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: bot-v3-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  prometheus-data:
  grafana-data:
  redis-data:

networks:
  bot-network:
    driver: bridge
